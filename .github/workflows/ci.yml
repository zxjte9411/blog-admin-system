name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base="$PUSH_BASE_SHA"
          head="$HEAD_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          fi

          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            files="$(git diff-tree --no-commit-id --name-only -r "$head")"
          else
            files="$(git diff --name-only "$base" "$head")"
          fi

          printf '%s\n' "$files"

          backend=false
          frontend=false
          integration=false

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              backend/*)
                backend=true
                integration=true
                ;;
              frontend/*)
                frontend=true
                integration=true
                ;;
              .github/workflows/*)
                backend=true
                frontend=true
                integration=true
                ;;
              docker-compose.yml|docker-compose.*.yml|.env.example|scripts/compose-smoke.sh|deploy/*)
                integration=true
                ;;
              *)
                # Unknown/root-level changes are treated conservatively.
                backend=true
                frontend=true
                integration=true
                ;;
            esac
          done <<< "$files"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Maven verify
        run: ./mvnw --batch-mode verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
      - name: Summarize JaCoCo coverage
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('target/site/jacoco/jacoco.xml')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if not report.exists():
              summary.open('a', encoding='utf-8').write('## Backend coverage\n\nJaCoCo report 未產生。\n')
          else:
              root = ET.parse(report).getroot()
              counters = {counter.attrib['type']: counter.attrib for counter in root.findall('counter')}
              lines = ['## Backend coverage', '', '| Metric | Covered | Missed | Coverage |', '| --- | ---: | ---: | ---: |']
              for metric in ('LINE', 'INSTRUCTION', 'BRANCH', 'METHOD', 'CLASS'):
                  counter = counters.get(metric)
                  if counter:
                      covered = int(counter['covered'])
                      missed = int(counter['missed'])
                      total = covered + missed
                      lines.append(f"| {metric.title()} | {covered} | {missed} | {covered / total * 100:.2f}% |" if total else f'| {metric.title()} | 0 | 0 | 0.00% |')
              summary.open('a', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY

  frontend-verify:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --coverage --coverage-reporters=lcov --coverage-reporters=html
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Summarize frontend coverage
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          report = Path('coverage/blog-admin/lcov.info')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if not report.exists():
              summary.open('a', encoding='utf-8').write('## Frontend coverage\n\nlcov.info 未產生。\n')
          else:
              data = report.read_text(encoding='utf-8')
              metrics = {}
              for prefix, name in (('DA:', 'line'), ('FNDA:', 'function'), ('BRDA:', 'branch')):
                  index = {'DA:': 1, 'FNDA:': 0, 'BRDA:': -1}[prefix]
                  values = [line[len(prefix):].split(',')[index] for line in data.splitlines() if line.startswith(prefix)]
                  covered = sum(value not in ('0', '-') for value in values)
                  metrics[name] = (covered, len(values))
              lines = ['## Frontend coverage', '', '| Metric | Covered | Total | Coverage |', '| --- | ---: | ---: | ---: |']
              for name in ('line', 'function', 'branch'):
                  covered, total = metrics[name]
                  lines.append(f'| {name.title()} | {covered} | {total} | {covered / total * 100:.2f}% |' if total else f'| {name.title()} | 0 | 0 | 0.00% |')
              summary.open('a', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY
      - name: Build
        run: npm run build

  compose-smoke:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env'); s=p.read_text()
          s=s.replace('POSTGRES_PASSWORD=', 'POSTGRES_PASSWORD=ci-postgres-password')
          s=s.replace('APP_SECURITY_JWT_SECRET=', 'APP_SECURITY_JWT_SECRET=ci-jwt-secret-012345678901234567890123456789')
          s=s.replace('SUPABASE_JWT_ISSUER=', 'SUPABASE_JWT_ISSUER=https://ci.supabase.co/auth/v1')
          s=s.replace('SUPABASE_JWKS_URL=', 'SUPABASE_JWKS_URL=https://ci.supabase.co/auth/v1/.well-known/jwks.json')
          s=s.replace('APP_BOOTSTRAP_ADMIN_PASSWORD=', 'APP_BOOTSTRAP_ADMIN_PASSWORD=ci-bootstrap-password-123')
          p.write_text(s)
          PY
      - name: Compose config
        run: docker compose config
      - name: Start Compose
        run: docker compose up --build --wait
      - name: HTTP smoke
        env:
          APP_BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          APP_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password-123
        run: bash scripts/compose-smoke.sh 2>&1 | tee smoke-output.log
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-smoke-diagnostics
          path: |
            smoke-output.log
            compose-logs.txt
      - name: Stop Compose
        if: always()
        run: docker compose down --volumes

  jacoco-pages:
    needs: [changes, verify]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.changes.outputs.backend == 'true' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: backend/target/site/jacoco
      - uses: actions/deploy-pages@v5
