name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Maven verify
        run: ./mvnw --batch-mode verify
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  frontend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env'); s=p.read_text()
          s=s.replace('POSTGRES_PASSWORD=', 'POSTGRES_PASSWORD=ci-postgres-password')
          s=s.replace('APP_SECURITY_JWT_SECRET=', 'APP_SECURITY_JWT_SECRET=ci-jwt-secret-012345678901234567890123456789')
          s=s.replace('APP_BOOTSTRAP_ADMIN_PASSWORD=', 'APP_BOOTSTRAP_ADMIN_PASSWORD=ci-bootstrap-password-123')
          p.write_text(s)
          PY
      - name: Compose config
        run: docker compose config
      - name: Start Compose
        run: docker compose up --build --wait
      - name: HTTP smoke
        env:
          APP_BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          APP_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password-123
        run: bash scripts/compose-smoke.sh 2>&1 | tee smoke-output.log
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-diagnostics
          path: |
            smoke-output.log
            compose-logs.txt
      - name: Stop Compose
        if: always()
        run: docker compose down --volumes

  jacoco-pages:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [verify, frontend-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
      - uses: actions/upload-pages-artifact@v3
        with:
          path: backend/target/site/jacoco
      - uses: actions/deploy-pages@v4
        continue-on-error: true
