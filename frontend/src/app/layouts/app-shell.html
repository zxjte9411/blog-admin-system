<a class="skip-link" href="#content">Skip to main content</a>
<header class="app-shell-header">
  <button
    #menuButton
    class="menu-toggle"
    type="button"
    [attr.aria-label]="
      isMenuOpen
        ? language.lang() === 'en'
          ? 'Close navigation menu'
          : '關閉導覽選單'
        : language.lang() === 'en'
          ? 'Open navigation menu'
          : '開啟導覽選單'
    "
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="mobile-navigation"
    (click)="toggleMenu()"
  >
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
  </button>
  <a routerLink="/public/articles" class="brand">{{ language.t.title }}</a>
  <span class="spacer"></span>
  <button class="ui-ghost" type="button" (click)="toggleLanguage()">
    {{ language.lang() === 'en' ? '繁中' : 'EN' }}
  </button>
  @if (auth.token) {
    <button class="ui-ghost logout-btn" type="button" (click)="logout()">
      {{ language.t.logout }}
    </button>
  } @else {
    <a class="ui-ghost" routerLink="/login">{{ language.t.login }}</a>
  }
</header>
<div class="shell">
  <aside
    #mobileNavigation
    id="mobile-navigation"
    class="app-shell-sidebar"
    [class.is-open]="isMenuOpen"
    [attr.role]="isMenuOpen ? 'dialog' : null"
    [attr.aria-label]="
      isMenuOpen ? (language.lang() === 'en' ? 'Navigation menu' : '導覽選單') : null
    "
    [attr.aria-modal]="isMenuOpen ? 'true' : null"
    tabindex="-1"
    (keydown)="onDrawerKeydown($event)"
  >
    <nav aria-label="Primary navigation">
      @for (group of navGroups; track group.label) {
        <section class="nav-group" [attr.aria-label]="navGroupLabel(group.label)">
          <h2>{{ navGroupLabel(group.label) }}</h2>
          <ul>
            @for (link of group.links; track link) {
              <li [hidden]="!canSeeNav(link)">
                <a
                  class="nav-link"
                  [routerLink]="link"
                  routerLinkActive="is-active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  [ariaCurrentWhenActive]="'page'"
                  (click)="onNavLinkClick()"
                >
                  {{ navLabel(link) }}
                </a>
              </li>
            }
          </ul>
        </section>
      }
    </nav>
  </aside>
  <button
    class="drawer-backdrop"
    type="button"
    [hidden]="!isMenuOpen"
    [attr.aria-label]="language.lang() === 'en' ? 'Close navigation menu' : '關閉導覽選單'"
    (click)="closeMenu()"
  ></button>
  <main id="content" class="app-shell-main" tabindex="-1" [attr.aria-busy]="loading">
    <ng-content />
  </main>
</div>
