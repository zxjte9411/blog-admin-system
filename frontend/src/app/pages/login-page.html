<app-shell [loading]="loading">
  <app-account-layout>
    <header class="page-intro">
      <p class="eyebrow">{{ language.t.title }}</p>
      <h1>{{ title }}</h1>
    </header>
    @if (loading) {
      <progress class="loading-bar" [attr.aria-label]="language.t.loading"></progress>
    }
    @if (callbackProcessing) {
      <div class="processing-status" role="status" aria-live="polite" aria-busy="true">
        {{ language.t.loginCallbackProcessing }}
      </div>
    }
    @if (message) {
      <div class="success" role="status">{{ message }}</div>
    }
    @if (error) {
      <div class="error" role="alert">{{ error }}</div>
    }
    @if (language.error()) {
      <div class="error" role="alert">{{ language.error() }}</div>
    }
    <fieldset class="login-controls" [disabled]="callbackProcessing">
      <app-account-form
        [form]="form"
        [fields]="fields"
        [loading]="loading"
        [submitAttempted]="submitAttempted"
        [login]="true"
        (submitted)="submit()"
      />
    </fieldset>
    @if (googleLoginAvailable) {
      <div class="oauth-divider" aria-hidden="true">
        <span>{{ language.t.or }}</span>
      </div>
      <button
        class="ui-ghost google-login"
        type="button"
        [disabled]="loading"
        (click)="googleLogin()"
      >
        {{ language.t.googleLogin }}
      </button>
    }
    <app-account-links [links]="links" [ariaLabel]="language.t.accountLinks" />
  </app-account-layout>
</app-shell>
