<form [formGroup]="form" (ngSubmit)="submitted.emit()">
  <fieldset [disabled]="loading">
    @for (field of fields; track field) {
      <label class="field" [for]="'field-' + field"
        >{{ fieldLabel(field) }}
        @if (field === 'preferredLanguage') {
          <select
            class="control"
            [id]="'field-' + field"
            [name]="field"
            autocomplete="language"
            [formControlName]="field"
            (change)="languageChanged.emit($any($event.target).value)"
            [attr.aria-invalid]="fieldInvalid(field) ? 'true' : null"
            [attr.aria-describedby]="fieldErrorId(field)"
          >
            <option value="zh-TW">{{ language.t.languages.zhTW }}</option>
            <option value="en">{{ language.t.languages.en }}</option>
          </select>
        } @else {
          <input
            class="control"
            [id]="'field-' + field"
            [name]="field"
            [type]="
              field.toLowerCase().includes('password')
                ? 'password'
                : field === 'email'
                  ? 'email'
                  : 'text'
            "
            [formControlName]="field"
            [attr.autocomplete]="autocomplete(field)"
            [attr.aria-invalid]="fieldInvalid(field) ? 'true' : null"
            [attr.aria-describedby]="
              fieldErrorId(field) +
              (field === 'newPassword' || (passwordHint && field === 'password')
                ? ' field-' + field + '-hint'
                : '') +
              (displayNameHint && field === 'displayName' ? ' field-' + field + '-hint' : '')
            "
          />
        }
        @if ((passwordHint && field === 'password') || field === 'newPassword') {
          <span class="field-hint" [id]="'field-' + field + '-hint'">{{
            language.t.passwordHint
          }}</span>
        }
        @if (displayNameHint && field === 'displayName') {
          <span class="field-hint" [id]="'field-' + field + '-hint'">{{
            language.t.displayNameHint
          }}</span>
        }
        <span class="field-error" [id]="fieldErrorId(field)" aria-live="polite">
          @if (fieldInvalid(field)) {
            {{ language.t.required }}
          }
        </span>
      </label>
    }
    <button class="ui-primary form-submit" type="submit">
      {{ language.t.submit }}
    </button>
  </fieldset>
</form>
