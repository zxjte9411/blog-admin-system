spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
  application:
    name: blog-admin-backend
  main:
    banner-mode: "off"
  jackson:
    time-zone: UTC
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/blog_admin}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:blog_admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:blog_admin}}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    properties:
      mail.smtp.connectiontimeout: 1000
      mail.smtp.timeout: 1000
      mail.smtp.writetimeout: 1000
app:
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    supabase:
      issuer: ${SUPABASE_JWT_ISSUER:}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      jwks-url: ${SUPABASE_JWKS_URL:http://localhost:54321/auth/v1/.well-known/jwks.json}
  mail:
    from: ${APP_MAIL_FROM:dev@example.com}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
